name: Auto Sync Fork

on:
  schedule:
    - cron: '0 0 * * *' # Setiap hari jam 00:00 UTC
  workflow_dispatch:    # Tombol manual

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4

      - name: Sync upstream changes
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.1
        with:
          # Parameter yang diperbaiki sesuai dokumentasi terbaru
          upstream_sync_repo: AhmadRizkyFebianto/bakoel_oli
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }} # Gunakan token bawaan GitHub

          # Setel ke true jika ingin memaksa sync meskipun ada perbedaan (opsional)
          test_mode: false
